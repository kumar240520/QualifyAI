services:
  - type: web
    name: qualifyai-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ENABLE_NEW_TTS
        value: "true"
      - key: TTS_PROVIDER
        value: "gemini_live"
      - key: TTS_FALLBACK_PROVIDER
        value: "gemini_live"
      - key: ENABLE_KOKORO
        value: "false"
      - key: PREWARM_TTS_CACHE
        value: "false"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"

