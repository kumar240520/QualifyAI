version: '3.8'

services:
  # Backend API Gateway & Voice WebSocket Server
  qualifyai-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: qualifyai-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:5000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - qualifyai-network

  # Frontend React SPA on Nginx
  qualifyai-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: qualifyai-client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      qualifyai-server:
        condition: service_healthy
    networks:
      - qualifyai-network

networks:
  qualifyai-network:
    driver: bridge
